  <!-- Apply saved theme immediately to prevent flash.
       Defaults to light mode if no preference has been saved, which
       matches the initial state in App.jsx. Keeping the two in sync
       avoids a dark-to-light flash on a first visit. -->
  <script>
    (function () {
      var saved = localStorage.getItem('theme');
      if (saved === 'dark') {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
