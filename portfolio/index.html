    <title>Allen Saji | Portfolio</title>
    <!-- Apply the saved (or the system's) theme before first paint, so there is no flash. -->
    <script>
      (function () {
        var t = null
        try { t = localStorage.getItem('pf-theme') } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.setAttribute('data-theme', t)
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/portfolio/main.jsx"></script>
  </body>
